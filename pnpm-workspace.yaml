minimumReleaseAgeExclude:
  - '@voidzero-dev/*'
  - vite-plus
  - '@vitest/*'
  - undici
  - '@oxfmt/*'
  - '@oxlint/*'
  - oxfmt@0.70.0
  - oxlint@1.85.0
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0
  vitest: 5.0.1
  vite-plus: 1.0.0-rc.0
  '@vitest/coverage-v8': 5.0.1
