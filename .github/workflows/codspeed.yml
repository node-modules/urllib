name: CodSpeed

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@6eb3ef76e48ad5aca2d217e4ee277786b3865699 # main
        with:
          node-version: '26'
          cache: true

      - name: Run benchmarks
        uses: CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062 # v5
        with:
          mode: simulation
          run: vp test bench --run
