name: Benchmarks

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # main
        with:
          node-version: '22'
          cache: true
          sfw: true

      - name: Run benchmarks
        # Restore CodSpeed reporting after configuring a Vitest 5 benchmark provider.
        run: vp run bench
