name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency:
      group: check-${{ github.workflow }}-#${{ github.event.pull_request.number || github.head_ref || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Audit GitHub Actions
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          annotations: true

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # main
        with:
          node-version: '26.13.0'
          cache: true
          cache-toolchain: true
          cache-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          sfw: true

      - name: Check
        run: vp run check

      - name: Check unused code and dependencies
        run: vp run fallow

      - name: Check dedupe
        run: vp dedupe --check

      - name: Run typecheck
        run: vp run typecheck

      - name: Run build check
        run: vp run build

  test:
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'macos-latest', 'windows-latest']
        node: ['22.23.3', '24.22.0', '26.12.0']

    name: Test (${{ matrix.os }}, ${{ matrix.node }})
    runs-on: ${{ matrix.os }}

    concurrency:
      group: test-${{ github.workflow }}-#${{ github.event.pull_request.number || github.head_ref || github.ref }}-(${{ matrix.os }}, ${{ matrix.node }})
      cancel-in-progress: true

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # main
        with:
          node-version: ${{ matrix.node }}
          cache: true
          cache-toolchain: true
          cache-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          sfw: true

      - name: Run tests
        run: vp run ci

      - name: Code Coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          use_oidc: true
